name: Respaldo diario de base de datos (BCK-01)

on:
  schedule:
    # 08:00 UTC = 03:00 hora Colombia (UTC-5), horario de bajo trafico.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # Cuantos dias se conserva un respaldo automatico antes de purgarlo (archivo
      # + fila). Los respaldos manuales (origen=manual) nunca se purgan solos.
      RETENTION_DIAS: "30"
    steps:
      - name: Instalar postgresql-client 17 (debe igualar o superar la version del servidor)
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # El runner ya trae postgresql-client 16 preinstalado en el PATH por
          # defecto; forzamos que los binarios de la 17 tengan prioridad.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Generar dump (schema condor)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          pg_dump "$SUPABASE_DB_URL" --schema=condor --format=custom --file="respaldo_${STAMP}.dump"

      - name: Calcular checksum y tamano
        run: |
          set -euo pipefail
          echo "CHECKSUM=$(sha256sum "respaldo_${STAMP}.dump" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "TAMANO=$(stat -c%s "respaldo_${STAMP}.dump")" >> "$GITHUB_ENV"
          echo "RUTA=diarios/respaldo_${STAMP}.dump" >> "$GITHUB_ENV"

      - name: Subir a Supabase Storage (bucket privado "respaldos")
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$SUPABASE_URL/storage/v1/object/respaldos/$RUTA" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@respaldo_${STAMP}.dump"

      - name: Espejo en Cloudflare R2 (resiliencia 3-2-1)
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "respaldo_${STAMP}.dump" "s3://$R2_BUCKET/$RUTA" \
            --endpoint-url "$R2_ENDPOINT"
          echo "RUTA_R2=$RUTA" >> "$GITHUB_ENV"

      - name: Registrar metadata en condor.respaldo
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$SUPABASE_URL/rest/v1/respaldo" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Content-Profile: condor" \
            -H "Prefer: return=minimal" \
            -d "{\"tipo\":\"completo\",\"tamano_bytes\":${TAMANO},\"ubicacion\":\"${RUTA}\",\"ubicacion_r2\":\"${RUTA_R2}\",\"checksum_sha256\":\"${CHECKSUM}\",\"estado\":\"completado\",\"origen\":\"automatico\"}"

      - name: Purgar respaldos automaticos con mas de RETENTION_DIAS dias
        if: success()
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
        run: |
          set -uo pipefail
          CUTOFF=$(date -u -d "-${RETENTION_DIAS} days" +%Y-%m-%dT%H:%M:%SZ)

          VIEJOS=$(curl -sf "$SUPABASE_URL/rest/v1/respaldo?estado=eq.completado&origen=eq.automatico&fecha=lt.${CUTOFF}&select=id_respaldo,ubicacion,ubicacion_r2" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Accept-Profile: condor") || VIEJOS="[]"

          echo "$VIEJOS" | jq -c '.[]' | while read -r row; do
            ID=$(echo "$row" | jq -r '.id_respaldo')
            UBI=$(echo "$row" | jq -r '.ubicacion')
            UBI_R2=$(echo "$row" | jq -r '.ubicacion_r2 // empty')
            echo "Purgando respaldo #$ID ($UBI, mas de $RETENTION_DIAS dias)"

            curl -sf -X DELETE "$SUPABASE_URL/storage/v1/object/respaldos/$UBI" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              || echo "  aviso: no se pudo borrar $UBI de Supabase Storage"

            if [ -n "$UBI_R2" ]; then
              aws s3 rm "s3://$R2_BUCKET/$UBI_R2" --endpoint-url "$R2_ENDPOINT" \
                || echo "  aviso: no se pudo borrar $UBI_R2 de R2"
            fi

            curl -sf -X PATCH "$SUPABASE_URL/rest/v1/respaldo?id_respaldo=eq.$ID" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -H "Content-Profile: condor" \
              -H "Prefer: return=minimal" \
              -d '{"estado":"purgado"}' \
              || echo "  aviso: no se pudo marcar #$ID como purgado"
          done

      - name: Registrar fallo en condor.respaldo (si algun paso previo fallo)
        if: failure()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/respaldo" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Content-Profile: condor" \
            -H "Prefer: return=minimal" \
            -d "{\"tipo\":\"completo\",\"ubicacion\":\"fallido\",\"estado\":\"fallido\",\"origen\":\"automatico\",\"detalle\":\"El workflow backup.yml fallo — revisar el run en GitHub Actions\"}" || true

      - name: Notificar a los admins del fallo
        if: failure()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -uo pipefail
          ROL_ID=$(curl -sf "$SUPABASE_URL/rest/v1/roles?select=id_rol&nombre=eq.admin" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Accept-Profile: condor" | jq -r '.[0].id_rol // empty')

          if [ -z "$ROL_ID" ]; then
            echo "aviso: no se encontro el rol admin, no se notifica a nadie"
            exit 0
          fi

          ADMIN_IDS=$(curl -sf "$SUPABASE_URL/rest/v1/usuarios?select=id_usuario&activo=eq.true&id_rol=eq.$ROL_ID" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Accept-Profile: condor" | jq -r '.[].id_usuario')

          for ID in $ADMIN_IDS; do
            curl -sf -X POST "$SUPABASE_URL/rest/v1/notificacion" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -H "Content-Profile: condor" \
              -H "Prefer: return=minimal" \
              -d "{\"id_usuario\":$ID,\"titulo\":\"Fallo el respaldo automatico\",\"mensaje\":\"El workflow backup.yml fallo esta madrugada. Revisa Actions en GitHub.\",\"vista\":\"respaldos\"}" \
              || echo "  aviso: no se pudo notificar al usuario $ID"
          done
