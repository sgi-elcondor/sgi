<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — El Cóndor</title>
  <meta name="description" content="Inicia sesión en el Sistema de Gestión Inmobiliaria de El Cóndor S.A.S." />
  <meta name="theme-color" content="#ff6a00" />
  <meta name="robots" content="index, follow" />

  <link rel="icon" href="/src/img/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://sgi.somoselcondor.com/login" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SGI El Cóndor" />
  <meta property="og:title" content="SGI · El Cóndor" />
  <meta property="og:description" content="Sistema de Gestión Inmobiliaria El Cóndor S.A.S." />
  <meta property="og:url" content="https://sgi.somoselcondor.com/login" />
  <meta property="og:image" content="https://sgi.somoselcondor.com/src/img/brand_logo_white.svg" />
  <meta property="og:image:alt" content="Logo de El Cóndor S.A.S." />
  <meta property="og:locale" content="es_CO" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SGI · El Cóndor" />
  <meta name="twitter:description" content="Sistema de Gestión Inmobiliaria El Cóndor S.A.S." />
  <meta name="twitter:image" content="https://sgi.somoselcondor.com/src/img/brand_logo_white.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base/tokens.css" />
  <link rel="stylesheet" href="/css/views/login.css" />
</head>
<body>

<div class="cracked-earth"></div>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" class="cracks-filter" aria-hidden="true">
  <filter id="cracks">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="5" seed="10" result="noise"></feTurbulence>
    <feColorMatrix type="luminanceToAlpha" in="noise" result="alphaNoise"></feColorMatrix>
    <feComponentTransfer in="alphaNoise" result="plates">
      <feFuncA type="discrete" tableValues="0 1"></feFuncA>
    </feComponentTransfer>
    <feConvolveMatrix order="3 3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" in="plates" result="edges"></feConvolveMatrix>
    <feComponentTransfer in="edges" result="invertedEdges">
      <feFuncR type="table" tableValues="1 0"></feFuncR>
      <feFuncG type="table" tableValues="1 0"></feFuncG>
      <feFuncB type="table" tableValues="1 0"></feFuncB>
    </feComponentTransfer>
    <feFlood flood-color="#f97316" result="bgColor"></feFlood>
    <feComposite operator="in" in="bgColor" in2="invertedEdges"></feComposite>
  </filter>
</svg>

<div class="card">
  <div class="brand">
    <picture class="brand-logo-wrap">
      <source srcset="/src/img/brand_logo_white.svg" media="(prefers-color-scheme: dark)" />
      <img src="/src/img/brand_logo_black.svg" alt="El Cóndor" class="brand-logo-img" />
    </picture>
  </div>

  <div class="tabs" id="tabs-principales">
    <button class="tab-btn active" id="tab-login" onclick="mostrarPanel('login')">Ingresar</button>
    <button class="tab-btn" id="tab-registro" onclick="mostrarPanel('registro')">Crear cuenta</button>
  </div>

  <!-- PANEL LOGIN -->
  <div class="panel active" id="panel-login">
    <div class="field">
      <label for="l-email">Correo electrónico</label>
      <input type="email" id="l-email" placeholder="usuario@ejemplo.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="l-password">Contraseña</label>
      <input type="password" id="l-password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <div style="text-align:right; margin-top:-.2rem; margin-bottom:1rem;">
      <button class="link-btn" onclick="mostrarPanel('recuperar')">¿Olvidaste tu contraseña?</button>
    </div>

    <button class="btn btn-primary" id="btn-login">Ingresar</button>

    <div class="divider-text">o continúa con</div>

    <button class="btn btn-google" id="btn-google-login">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.84l6.08-6.08C34.49 3.1 29.5 1 24 1 14.82 1 7.07 6.48 3.64 14.18l7.08 5.5C12.4 13.67 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.67c-.55 2.97-2.2 5.48-4.67 7.17l7.18 5.57C43.46 37.32 46.5 31.36 46.5 24.5z"/>
        <path fill="#FBBC05" d="M10.72 28.32A14.54 14.54 0 0 1 9.5 24c0-1.5.26-2.95.72-4.32l-7.08-5.5A23.93 23.93 0 0 0 .5 24c0 3.87.92 7.53 2.54 10.77l7.68-6.45z"/>
        <path fill="#34A853" d="M24 46.5c5.5 0 10.12-1.82 13.5-4.95l-7.18-5.57c-1.78 1.2-4.07 1.9-6.32 1.9-6.26 0-11.6-4.17-13.28-9.81l-7.68 6.45C7.07 41.52 14.82 46.5 24 46.5z"/>
      </svg>
      Google
    </button>

    <div class="error-box" id="l-error"></div>
  </div>

  <!-- PANEL REGISTRO -->
  <div class="panel" id="panel-registro">
    <div class="field">
      <label for="r-email">Correo electrónico</label>
      <input type="email" id="r-email" placeholder="usuario@ejemplo.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="r-password">Contraseña</label>
      <input type="password" id="r-password" placeholder="Mínimo 8 caracteres"
             autocomplete="new-password" oninput="validarPassword(this.value)" />
      <div class="pwd-rules">
        <span class="pwd-rule" id="rule-len">Mínimo 8 caracteres</span>
        <span class="pwd-rule" id="rule-upper">Una letra mayúscula</span>
        <span class="pwd-rule" id="rule-num">Un número</span>
      </div>
    </div>

    <div class="field">
      <label for="r-confirm">Confirmar contraseña</label>
      <input type="password" id="r-confirm" placeholder="Repite la contraseña" autocomplete="new-password" />
    </div>

    <button class="btn btn-primary" id="btn-registro" style="margin-top:.25rem;">Crear cuenta</button>

    <div class="divider-text">o continúa con</div>

    <button class="btn btn-google" id="btn-google-registro">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.84l6.08-6.08C34.49 3.1 29.5 1 24 1 14.82 1 7.07 6.48 3.64 14.18l7.08 5.5C12.4 13.67 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.67c-.55 2.97-2.2 5.48-4.67 7.17l7.18 5.57C43.46 37.32 46.5 31.36 46.5 24.5z"/>
        <path fill="#FBBC05" d="M10.72 28.32A14.54 14.54 0 0 1 9.5 24c0-1.5.26-2.95.72-4.32l-7.08-5.5A23.93 23.93 0 0 0 .5 24c0 3.87.92 7.53 2.54 10.77l7.68-6.45z"/>
        <path fill="#34A853" d="M24 46.5c5.5 0 10.12-1.82 13.5-4.95l-7.18-5.57c-1.78 1.2-4.07 1.9-6.32 1.9-6.26 0-11.6-4.17-13.28-9.81l-7.68 6.45C7.07 41.52 14.82 46.5 24 46.5z"/>
      </svg>
      Continuar con Google
    </button>

    <div class="error-box" id="r-error"></div>
    <div class="success-box" id="r-success"></div>
  </div>

  <!-- PANEL RECUPERAR -->
  <div class="panel" id="panel-recuperar">
    <div style="margin-bottom:1.25rem;">
      <p style="font-size:.92rem; color:var(--text-muted); line-height:1.6;">
        Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
      </p>
    </div>

    <div class="field">
      <label for="rec-email">Correo electrónico</label>
      <input type="email" id="rec-email" placeholder="usuario@ejemplo.com" autocomplete="email" />
    </div>

    <button class="btn btn-primary" id="btn-recuperar">Enviar enlace</button>

    <div style="text-align:center; margin-top:.95rem;">
      <button class="link-btn" onclick="mostrarPanel('login')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Volver al inicio de sesión</button>
    </div>

    <div class="error-box" id="rec-error"></div>
    <div class="success-box" id="rec-success"></div>
  </div>

  <!-- PANEL 2FA -->
  <div class="panel" id="panel-2fa">
    <div style="margin-bottom:1.25rem;">
      <p id="fa-intro" style="font-size:.92rem; color:var(--text-muted); line-height:1.6;">
        Ingresa el código de 6 dígitos que enviamos a tu correo.
      </p>
    </div>

    <div class="field">
      <label for="fa-codigo">Código de verificación</label>
      <input type="text" id="fa-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
    </div>

    <button class="btn btn-primary" id="btn-2fa">Verificar</button>

    <div style="text-align:center; margin-top:.95rem;">
      <button class="link-btn" id="btn-2fa-reenviar">Reenviar código</button>
    </div>
    <div style="text-align:center; margin-top:.5rem;">
      <button class="link-btn" onclick="mostrarPanel('login')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Volver al inicio de sesión</button>
    </div>

    <div class="error-box" id="fa-error"></div>
    <div class="success-box" id="fa-success"></div>
  </div>

  <div class="card-footer">SGI v1.0 · El Cóndor</div>
</div>

<script type="module">
  import {
    loginEmail, loginGoogle,
    esperarAuthListo,
    registerEmail,
    resetPassword,
    verificar2FA,
    reenviar2FA
  } from '/js/auth.js';
  import { isPasswordPwned } from '/js/pwned-password.js';

  esperarAuthListo().then(user => {
    if (user) (window.top || window).location.href = '/app';
  });

  // ── i18n + theme, synced from the public landing (same-origin) ──
  const LOGIN_I18N = {
    es: {
      tabLogin: "Ingresar", tabRegister: "Crear cuenta",
      email: "Correo electrónico", password: "Contraseña", confirm: "Confirmar contraseña",
      forgot: "¿Olvidaste tu contraseña?", signin: "Ingresar", create: "Crear cuenta",
      orContinue: "o continúa con", googleLogin: "Google", googleRegister: "Continuar con Google",
      ruleLen: "Mínimo 8 caracteres", ruleUpper: "Una letra mayúscula", ruleNum: "Un número",
      recoverText: "Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.",
      sendLink: "Enviar enlace", backToLogin: "Volver al inicio de sesión",
      phEmail: "usuario@ejemplo.com", phPassword: "••••••••", phNewPassword: "Mínimo 8 caracteres", phConfirm: "Repite la contraseña",
    },
    en: {
      tabLogin: "Sign in", tabRegister: "Sign up",
      email: "Email", password: "Password", confirm: "Confirm password",
      forgot: "Forgot your password?", signin: "Sign in", create: "Create account",
      orContinue: "or continue with", googleLogin: "Google", googleRegister: "Continue with Google",
      ruleLen: "At least 8 characters", ruleUpper: "One uppercase letter", ruleNum: "One number",
      recoverText: "Enter your email and we will send you a link to reset your password.",
      sendLink: "Send link", backToLogin: "Back to sign in",
      phEmail: "user@example.com", phPassword: "••••••••", phNewPassword: "At least 8 characters", phConfirm: "Repeat the password",
    },
  };

  function applyLoginLang(lang) {
    const d = LOGIN_I18N[lang] || LOGIN_I18N.es;
    document.documentElement.lang = lang;
    const set = (sel, val) => { const el = document.querySelector(sel); if (el) el.textContent = val; };
    set('#tab-login', d.tabLogin); set('#tab-registro', d.tabRegister);
    set('label[for="l-email"]', d.email); set('label[for="l-password"]', d.password);
    set('label[for="r-email"]', d.email); set('label[for="r-password"]', d.password); set('label[for="r-confirm"]', d.confirm);
    set('label[for="rec-email"]', d.email);
    set('#panel-login .link-btn', d.forgot);
    set('#rule-len', d.ruleLen); set('#rule-upper', d.ruleUpper); set('#rule-num', d.ruleNum);
    set('#panel-recuperar p', d.recoverText);
    document.querySelectorAll('.divider-text').forEach(el => { el.textContent = d.orContinue; });
    const setBtn = (id, val) => { const b = document.getElementById(id); if (b && !b.querySelector('.spinner')) b.textContent = val; };
    setBtn('btn-login', d.signin); setBtn('btn-registro', d.create); setBtn('btn-recuperar', d.sendLink);
    const gl = document.getElementById('btn-google-login');    if (gl && gl.lastChild) gl.lastChild.nodeValue = ' ' + d.googleLogin;
    const gr = document.getElementById('btn-google-registro'); if (gr && gr.lastChild) gr.lastChild.nodeValue = ' ' + d.googleRegister;
    const back = document.querySelector('#panel-recuperar .link-btn'); if (back && back.lastChild) back.lastChild.nodeValue = ' ' + d.backToLogin;
    const ph = (id, val) => { const el = document.getElementById(id); if (el) el.placeholder = val; };
    ph('l-email', d.phEmail); ph('r-email', d.phEmail); ph('rec-email', d.phEmail);
    ph('l-password', d.phPassword); ph('r-password', d.phNewPassword); ph('r-confirm', d.phConfirm);
  }

  function applyLoginTheme(theme) {
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
  }

  window.previewApplyLang  = applyLoginLang;
  window.previewApplyTheme = applyLoginTheme;

  (function initPrefs() {
    const th = localStorage.getItem('sgi_theme');
    applyLoginTheme((th === 'dark' || th === 'light')
      ? th
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    applyLoginLang(localStorage.getItem('sgi_lang') === 'en' ? 'en' : 'es');
  })();

  const ERROR_MSG = {
    'auth/invalid-email':           'El correo no tiene un formato válido.',
    'auth/user-not-found':          'No existe una cuenta con ese correo.',
    'auth/wrong-password':          'Contraseña incorrecta.',
    'auth/invalid-credential':      'Correo o contraseña incorrectos.',
    'auth/too-many-requests':       'Demasiados intentos. Intenta más tarde.',
    'auth/user-disabled':           'Esta cuenta fue deshabilitada.',
    'auth/email-already-in-use':    'Ya existe una cuenta con ese correo.',
    'auth/weak-password':           'La contraseña es demasiado débil.',
    'auth/popup-closed-by-user':    null,
    'auth/cancelled-popup-request': null,
    'auth/popup-blocked':           'El navegador bloqueó la ventana. Permite popups para este sitio.',
    'auth/network-request-failed':  'Sin conexión. Verifica tu red.',
    'auth/unauthorized-domain':     'Este dominio no está autorizado para iniciar sesión. Contacta al administrador.',
  };

  function mensajeError(err) {
    return ERROR_MSG[err.code] ?? ('Error: ' + err.message);
  }

  function showError(id, err) {
    if (err.code in ERROR_MSG && ERROR_MSG[err.code] === null) return;
    const el = document.getElementById(id);
    el.textContent = mensajeError(err);
    el.style.display = 'block';
  }

  function showSuccess(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideMessages(...ids) {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }

  function setLoading(btn, loading, esGoogle) {
    btn.disabled = loading;
    if (loading) {
      btn.dataset.original = btn.innerHTML;
      const cls = esGoogle ? 'spinner spinner-dark' : 'spinner';
      btn.innerHTML = '<span class="' + cls + '"></span> Cargando...';
    } else {
      btn.innerHTML = btn.dataset.original || btn.innerHTML;
    }
  }

  window.mostrarPanel = function(panel) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + panel).classList.add('active');

    const tabs = document.getElementById('tabs-principales');
    if (panel === 'recuperar' || panel === '2fa') {
      tabs.style.display = 'none';
    } else {
      tabs.style.display = 'flex';
      document.getElementById('tab-login').classList.toggle('active', panel === 'login');
      document.getElementById('tab-registro').classList.toggle('active', panel === 'registro');
    }
  };

  window.validarPassword = function(val) {
    document.getElementById('rule-len').classList.toggle('ok', val.length >= 8);
    document.getElementById('rule-upper').classList.toggle('ok', /[A-Z]/.test(val));
    document.getElementById('rule-num').classList.toggle('ok', /[0-9]/.test(val));
  };

  document.getElementById('btn-login').addEventListener('click', async () => {
    hideMessages('l-error');
    const email = document.getElementById('l-email').value.trim();
    const pwd = document.getElementById('l-password').value;

    if (!email || !pwd) {
      const el = document.getElementById('l-error');
      el.textContent = 'Completa todos los campos.';
      el.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btn-login');
    setLoading(btn, true);

    try {
      // The backend verifies the password and enforces the lockout; on failure it throws an
      // Error carrying the block state and remaining attempts. Sensitive roles resolve to
      // { requiere2FA: true, ... } instead of opening a session right away (SEG-04).
      const resultado = await loginEmail(email, pwd);
      if (resultado.requiere2FA) {
        _2faChallengeId = resultado.challengeId;
        document.getElementById('fa-intro').textContent = resultado.primeraConfig
          ? 'Tu cuenta necesita verificación en dos pasos. Te enviamos un código de 6 dígitos a tu correo para activarla.'
          : 'Ingresa el código de 6 dígitos que enviamos a tu correo.';
        document.getElementById('fa-codigo').value = '';
        hideMessages('fa-error', 'fa-success');
        mostrarPanel('2fa');
        document.getElementById('fa-codigo').focus();
        return;
      }
      (window.top || window).location.href = '/app';
    } catch (err) {
      const el = document.getElementById('l-error');

      if (err.bloqueado || err.code === 'CUENTA_BLOQUEADA') {
        el.textContent = 'Demasiados intentos fallidos. Intenta de nuevo en 30 minutos.';
      } else {
        el.textContent = err.message || 'Correo o contraseña incorrectos.';
        if (err.intentos_restantes != null && err.intentos_restantes >= 0 && err.intentos_restantes <= 2) {
          el.textContent += ` Cuidado: te queda${err.intentos_restantes === 1 ? '' : 'n'} ${err.intentos_restantes} intento${err.intentos_restantes === 1 ? '' : 's'}.`;
        }
      }

      el.style.display = 'block';
    } finally {
      setLoading(btn, false);
    }
  });

  document.getElementById('l-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });

  // ── SEG-04: segundo paso (código de 6 dígitos) ──
  let _2faChallengeId    = null;
  let _2faReenvioEnFriar = false;

  document.getElementById('fa-codigo').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  });

  document.getElementById('fa-codigo').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-2fa').click();
  });

  document.getElementById('btn-2fa').addEventListener('click', async () => {
    hideMessages('fa-error', 'fa-success');
    const codigo = document.getElementById('fa-codigo').value.trim();

    if (!/^\d{6}$/.test(codigo)) {
      const el = document.getElementById('fa-error');
      el.textContent = 'Ingresa los 6 dígitos del código.';
      el.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btn-2fa');
    setLoading(btn, true);

    try {
      await verificar2FA(_2faChallengeId, codigo);
      (window.top || window).location.href = '/app';
    } catch (err) {
      const el = document.getElementById('fa-error');

      if (err.bloqueado || err.code === 'CUENTA_BLOQUEADA_2FA') {
        el.textContent = 'Demasiados códigos incorrectos. Intenta de nuevo en 30 minutos.';
      } else if (['MAX_INTENTOS', 'CODIGO_EXPIRADO', 'CHALLENGE_INVALIDO'].includes(err.code)) {
        el.textContent = (err.message || 'La verificación expiró.') + ' Vuelve a ingresar tu contraseña.';
        setTimeout(() => mostrarPanel('login'), 2500);
      } else {
        el.textContent = err.message || 'Código incorrecto.';
      }

      el.style.display = 'block';
    } finally {
      setLoading(btn, false);
    }
  });

  document.getElementById('btn-2fa-reenviar').addEventListener('click', async () => {
    if (_2faReenvioEnFriar) return;
    hideMessages('fa-error', 'fa-success');

    _2faReenvioEnFriar = true;
    setTimeout(() => { _2faReenvioEnFriar = false; }, 15000);

    try {
      await reenviar2FA(_2faChallengeId);
      showSuccess('fa-success', 'Te enviamos un nuevo código a tu correo.');
    } catch (err) {
      const el = document.getElementById('fa-error');
      el.textContent = err.message || 'No se pudo reenviar el código.';
      el.style.display = 'block';
    }
  });

  document.getElementById('btn-google-login').addEventListener('click', async () => {
    hideMessages('l-error');
    const btn = document.getElementById('btn-google-login');
    setLoading(btn, true, true);

    try {
      await loginGoogle();
      (window.top || window).location.href = '/app';
    } catch (err) {
      showError('l-error', err);
    } finally {
      setLoading(btn, false, true);
    }
  });

  document.getElementById('btn-registro').addEventListener('click', async () => {
    hideMessages('r-error', 'r-success');
    const email = document.getElementById('r-email').value.trim();
    const pwd = document.getElementById('r-password').value;
    const confirm = document.getElementById('r-confirm').value;

    if (!email || !pwd || !confirm) {
      const el = document.getElementById('r-error');
      el.textContent = 'Completa todos los campos.';
      el.style.display = 'block';
      return;
    }

    if (pwd.length < 8 || !/[A-Z]/.test(pwd) || !/[0-9]/.test(pwd)) {
      const el = document.getElementById('r-error');
      el.textContent = 'La contraseña no cumple los requisitos.';
      el.style.display = 'block';
      return;
    }

    if (pwd !== confirm) {
      const el = document.getElementById('r-error');
      el.textContent = 'Las contraseñas no coinciden.';
      el.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btn-registro');
    setLoading(btn, true);

    if (await isPasswordPwned(pwd)) {
      setLoading(btn, false);
      const el = document.getElementById('r-error');
      el.textContent = 'Esta contraseña apareció en filtraciones de datos conocidas. Por tu seguridad, elige otra.';
      el.style.display = 'block';
      return;
    }

    try {
      await registerEmail(email, pwd);
      document.getElementById('r-email').value = '';
      document.getElementById('r-password').value = '';
      document.getElementById('r-confirm').value = '';
      showSuccess('r-success', 'Cuenta creada. Te enviamos un correo de verificación a ' + email + '. Verifícalo y luego inicia sesión.');
    } catch (err) {
      showError('r-error', err);
    } finally {
      setLoading(btn, false);
    }
  });

  document.getElementById('btn-google-registro').addEventListener('click', async () => {
    hideMessages('r-error', 'r-success');
    const btn = document.getElementById('btn-google-registro');
    setLoading(btn, true, true);

    try {
      await loginGoogle();
      (window.top || window).location.href = '/app';
    } catch (err) {
      showError('r-error', err);
    } finally {
      setLoading(btn, false, true);
    }
  });

  document.getElementById('btn-recuperar').addEventListener('click', async () => {
    hideMessages('rec-error', 'rec-success');
    const email = document.getElementById('rec-email').value.trim();

    if (!email) {
      const el = document.getElementById('rec-error');
      el.textContent = 'Ingresa tu correo electrónico.';
      el.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btn-recuperar');
    setLoading(btn, true);

    try {
      await resetPassword(email);
      showSuccess('rec-success', 'Enlace enviado. Revisa tu bandeja de entrada y la carpeta de spam.');
      document.getElementById('rec-email').value = '';
    } catch (err) {
      showError('rec-error', err);
    } finally {
      setLoading(btn, false);
    }
  });

  document.getElementById('rec-email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-recuperar').click();
  });
</script>

</body>
</html>
