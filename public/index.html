<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SGI · El Cóndor</title>
  <meta name="description" content="Sistema de Gestión Inmobiliaria El Cóndor" />
  <meta name="theme-color" content="#ff6a00" />

  <link rel="canonical" href="https://sgi.somoselcondor.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SGI El Cóndor" />
  <meta property="og:title" content="SGI · El Cóndor" />
  <meta property="og:description" content="Sistema de Gestión Inmobiliaria El Cóndor" />
  <meta property="og:url" content="https://sgi.somoselcondor.com/" />
  <meta property="og:image" content="https://sgi.somoselcondor.com/src/img/brand_logo_white.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="SGI · El Cóndor" />
  <meta name="twitter:description" content="Sistema de Gestión Inmobiliaria El Cóndor" />

  <link rel="icon" href="/src/img/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <!-- Estilos principales -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Estilos específicos de vistas -->
  <link rel="stylesheet" href="/css/views/comprador.css" />

  <!-- Responsive global: debe ir después de todos los CSS -->
  <link rel="stylesheet" href="/css/responsive.css?v=1" />
</head>

<body>
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="sidebar-brand">
      <div class="brand-brand">
        <img src="/src/img/brand_logo_black.svg" alt="Logo El Cóndor" class="brand-logo brand-logo-light" />
        <img src="/src/img/brand_logo_white.svg" alt="Logo El Cóndor" class="brand-logo brand-logo-dark" />
      </div>

      <button
        type="button"
        class="sidebar-toggle"
        id="sidebarToggle"
        aria-label="Colapsar barra lateral"
        aria-pressed="false"
        title="Colapsar barra lateral"
      >
        <i data-lucide="panel-left-close"></i>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-footer">SGI v0.7</div>
  </aside>

  <div class="mobile-sidebar-backdrop" id="mobileSidebarBackdrop"></div>

  <main class="main-content">
    <header class="topbar">
            <div class="topbar-left">
        <button
          type="button"
          class="mobile-menu-toggle"
          id="mobileMenuToggle"
          aria-label="Abrir menú"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 7h16M4 12h16M4 17h16"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <div class="topbar-heading">
          <h1 class="view-title" id="viewTitle">Dashboard</h1>
          <span class="topbar-subtitle" id="topbarSubtitle">
            Centro de operación inmobiliaria
          </span>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="role-view-switcher" id="roleViewSwitcher" style="display:none" aria-label="Simular vista de rol">
          <span class="rvs-icon"><i data-lucide="eye"></i></span>
          <select id="roleViewSelect" class="rvs-select" aria-label="Vista de rol"></select>
        </div>

        <div class="user-menu" id="userMenu">
          <button
            type="button"
            class="user-menu-btn"
            id="userMenuBtn"
            aria-label="Menú de usuario"
            aria-expanded="false"
            aria-haspopup="true"
          >
            <i data-lucide="user"></i>
          </button>

          <div class="user-menu-panel" id="userMenuPanel" aria-hidden="true"></div>
        </div>
      </div>
    </header>

    <div id="roleSimBanner" class="role-sim-banner" hidden>
      <span class="role-sim-banner-icon"><i data-lucide="eye"></i></span>
      <span class="role-sim-banner-text">Simulando vista de: <strong id="roleSimBannerLabel"></strong></span>
      <button type="button" id="roleSimBannerExit" class="role-sim-banner-exit">
        <i data-lucide="x"></i>
        Salir de simulacion
      </button>
    </div>

    <section class="view-container" id="viewContainer" aria-live="polite">
      <!-- Las vistas se renderizan aquí -->
    </section>
  </main>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>

        <button type="button" class="modal-close" id="modalClose" aria-label="Cerrar modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body" id="modalBody"></div>


    </div>
  </div>

  <!--
    ORDEN DE CARGA — IMPORTANTE:
    1. auth.js          -> inicializa Firebase y expone window._authReady / window._firebaseAuth
    2. api.js           -> usa window._firebaseAuth para refrescar tokens
    3. ui.js            -> utilidades visuales globales
    4. vistas           -> registran funciones de render
    5. librerías externas
    6. app.js           -> inicializa navegación y lógica principal
  -->

  <script type="module" src="/js/auth.js"></script>

  <script>
    window.onerror = (msg, src, line) => {
      console.error(`[ERROR] ${msg} | ${src} | línea ${line}`);
    };
  </script>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components/money-input.js"></script>
  <script src="/js/helpers.js"></script>
  <script src="/js/state.js"></script>

  <script src="/js/views/dashboard.js"></script>

  <!-- Operacion -->
  <script src="/js/views/operacion/el-proyecto.js"></script>
  <script src="/js/views/operacion/proyectos.js"></script>
  <script src="/js/views/operacion/lotes.js"></script>
  <script src="/js/views/operacion/compradores.js"></script>
  <script src="/js/views/operacion/ventas.js"></script>
  <script src="/js/views/operacion/recepciones.js"></script>

  <!-- Finanzas -->
  <script src="/js/views/finanzas/cuotas.js"></script>
  <script src="/js/views/finanzas/pagos.js"></script>
  <script src="/js/views/finanzas/comisionistas.js"></script>
  <script src="/js/views/finanzas/facturas.js"></script>
  <script src="/js/views/finanzas/recibos.js"></script>
  <script src="/js/views/finanzas/gastos.js"></script>
  <script src="/js/views/finanzas/transacciones.js"></script>
  <script src="/js/views/finanzas/validacion-pagos.js"></script>

  <!-- Control -->
  <script src="/js/views/control/reportes.js"></script>
  <script src="/js/views/control/auditoria.js"></script>
  <script src="/js/views/control/personal.js"></script>
  <script src="/js/views/control/usuarios.js"></script>
  <script src="/js/views/control/permisos.js"></script>

  <!-- Juridico -->
  <script src="/js/views/juridico/juridico.js"></script>

  <!-- Mi cuenta -->
  <script src="/js/views/mi-cuenta/mis-cuotas.js"></script>
  <script src="/js/views/mi-cuenta/mis-facturas.js"></script>
  <script src="/js/views/mi-cuenta/mis-recibos.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="/js/components/avatar-cropper.js"></script>
  <script src="/js/components/sgi-select.js"></script>
  <script src="/js/lib/qrcode.min.js"></script>
  <script src="/js/components/export-styles.js"></script>
  <script src="/js/components/brand-assets.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/user-menu.js"></script>
  <script src="/js/components/onboarding.js"></script>
  <script src="/js/components/role-switcher.js"></script>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
