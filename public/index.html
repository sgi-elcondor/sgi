<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SGI · El Cóndor</title>
  <meta name="description" content="Sistema de Gestión Inmobiliaria El Cóndor" />
  <meta name="theme-color" content="#ff6a00" />

  <link rel="icon" href="/src/img/favicon_white.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet"
  />

  <!-- Estilos principales -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Estilos específicos de vistas -->
  <link rel="stylesheet" href="/css/views/comprador.css" />

  <!-- Responsive global: debe ir después de todos los CSS -->
  <link rel="stylesheet" href="/css/responsive.css?v=1" />
</head>

<body>
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="sidebar-brand">
      <div class="brand-brand">
        <span class="brand-icon">
          <img src="/src/img/favicon_white.svg" alt="Logo El Cóndor" class="brand-logo" />
        </span>
        <span class="brand-name">El Cóndor</span>
      </div>

      <button
        type="button"
        class="sidebar-toggle"
        id="sidebarToggle"
        aria-label="Colapsar barra lateral"
        aria-pressed="false"
        title="Colapsar barra lateral"
      >
        <i data-lucide="panel-left-close"></i>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-footer">SGI v0.7</div>
  </aside>

  <div class="mobile-sidebar-backdrop" id="mobileSidebarBackdrop"></div>

  <main class="main-content">
    <header class="topbar">
            <div class="topbar-left">
        <button
          type="button"
          class="mobile-menu-toggle"
          id="mobileMenuToggle"
          aria-label="Abrir menú"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 7h16M4 12h16M4 17h16"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <div class="topbar-heading">
          <h1 class="view-title" id="viewTitle">Dashboard</h1>
          <span class="topbar-subtitle" id="topbarSubtitle">
            Centro de operación inmobiliaria
          </span>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="user-menu" id="userMenu">
          <button
            type="button"
            class="user-menu-btn"
            id="userMenuBtn"
            aria-label="Menú de usuario"
            aria-expanded="false"
            aria-haspopup="true"
          >
            <i data-lucide="user"></i>
          </button>

          <div class="user-menu-panel" id="userMenuPanel" aria-hidden="true"></div>
        </div>
      </div>
    </header>

    <section class="view-container" id="viewContainer" aria-live="polite">
      <!-- Las vistas se renderizan aquí -->
    </section>
  </main>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>

        <button type="button" class="modal-close" id="modalClose" aria-label="Cerrar modal">
          ✕
        </button>
      </div>

      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!--
    ORDEN DE CARGA — IMPORTANTE:
    1. auth.js          -> inicializa Firebase y expone window._authReady / window._firebaseAuth
    2. api.js           -> usa window._firebaseAuth para refrescar tokens
    3. ui.js            -> utilidades visuales globales
    4. vistas           -> registran funciones de render
    5. librerías externas
    6. app.js           -> inicializa navegación y lógica principal
  -->

  <script type="module" src="/js/auth.js"></script>

  <script>
    window.onerror = (msg, src, line) => {
      console.error(`[ERROR] ${msg} | ${src} | línea ${line}`);
    };
  </script>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>

  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/proyectos.js"></script>
  <script src="/js/views/lotes.js"></script>
  <script src="/js/views/compradores.js"></script>
  <script src="/js/views/ventas.js"></script>
  <script src="/js/views/cuotas.js"></script>
  <script src="/js/views/pagos.js"></script>
  <script src="/js/views/comisionistas.js"></script>
  <script src="/js/views/facturas.js"></script>
  <script src="/js/views/recibos.js"></script>
  <script src="/js/views/reportes.js"></script>
  <script src="/js/views/alertas.js"></script>
  <script src="/js/views/juridico.js"></script>
  <script src="/js/views/personal.js"></script>
  <script src="/js/views/usuarios.js"></script>
  <script src="/js/views/roles.js"></script>
  <script src="/js/views/bank_transactions.js"></script>
  <script src="/js/views/payment_validation.js"></script>
  <script src="/js/views/comprador.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
